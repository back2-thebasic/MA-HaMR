# Official H2O train split -- v5 visual-quality fine-tuning.
#
# v4+safeguard prevents catastrophic degradation but visualized refined hands
# can still be far from the expert/real hand. Root cause: the normalized
# Geman-McClure projection loss saturates at large pixel errors, so visibly bad
# predictions do not receive enough gradient to get pulled back onto kp_2d.
#
# v5 keeps the stable v4 model and adds a non-saturating pixel Huber projection
# loss (loss_weights.proj_huber) so large 2D errors keep producing gradient.

seed: 0
device: cuda:0

dataset:
  processed_root: /extra/SuC/data/mahmr/processed
  features_root: /extra/SuC/data/mahmr/features
  manifest_path: /extra/SuC/data/mahmr/manifests/sequences.jsonl
  sequence_names:
    - h2o_s1_h1
    - h2o_s1_h2
    - h2o_s1_k1
    - h2o_s1_k2
    - h2o_s1_o1
    - h2o_s1_o2
    - h2o_s2_h1
    - h2o_s2_h2
    - h2o_s2_k1
    - h2o_s2_k2
    - h2o_s2_o1
    - h2o_s2_o2
    - h2o_s3_h1
    - h2o_s3_h2
    - h2o_s3_k1
  window_size: 256
  stride: 128

model:
  num_hands: 2
  img_feat_dim: 512
  d_mem: 128
  d_val: 123
  hidden_dim: 256
  num_blocks: 4
  topk: 8
  exclude_recent: 5
  max_memory_size: 1024
  dropout: 0.1

geometry:
  use_mano: true
  mano_model_path: /data/SuC/Dyn-HaMR/_DATA/data/mano
  flat_hand_mean: false

loss_weights:
  distill: 1.0
  proj: 0.5
  proj_huber: 0.8
  proj_huber_delta: 50.0
  bone: 0.1
  consistency: 0.05
  scale: 0.2
  scale_distill: 0.7
  scale_anchor: 1.0
  prior: 0.04

train:
  epochs: 1200
  max_steps: 8000
  batch_size: 1
  shuffle: true
  num_workers: 0
  lr: 0.00005
  lr_min: 0.000003
  lr_schedule: cosine
  weight_decay: 0.0002
  grad_clip: 1.0
  resume_from: /extra/SuC/experiments/mahmr/h2o_official_train_v4/last.pt
  resume_optimizer: false
  log_every: 10
  plot_every: 100
  output_dir: /extra/SuC/experiments/mahmr/h2o_official_train_v5_visual
