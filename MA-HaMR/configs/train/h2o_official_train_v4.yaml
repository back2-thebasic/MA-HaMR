# Official H2O train split -- v4 generalization fix.
#
# Motivation: v1/v3 reached expert-level FIT on the train split but failed to
# generalize to held-out val/test (pose/root overfit + catastrophic projection
# outliers where a few frames sent the hand flying off-image).
#
# v4 changes (relative to h2o_official_train_v1):
#   * model.dropout 0.0 -> 0.1                (regularization)
#   * train.weight_decay 1e-4 -> 2e-4         (regularization)
#   * loss_weights.prior 0.04 -> 0.08         (stay-near-init, anti-overfit)
#   * code: soft-bounded residuals            (anti-outlier, see refinement.py)
#   * code: pose/root distill softened,       (loss.py _COMPONENT_*)
#           pose/root prior strengthened,
#           mild betas/trans prior added
#   * warm-start from the v1 train checkpoint and re-anneal with regularization
#
# Validation/test stay held-out; evaluate with
# scripts/evaluate_refined.py --memory-mode none.

seed: 0
device: cuda:0

dataset:
  processed_root: /extra/SuC/data/mahmr/processed
  features_root: /extra/SuC/data/mahmr/features
  manifest_path: /extra/SuC/data/mahmr/manifests/sequences.jsonl
  sequence_names:
    - h2o_s1_h1
    - h2o_s1_h2
    - h2o_s1_k1
    - h2o_s1_k2
    - h2o_s1_o1
    - h2o_s1_o2
    - h2o_s2_h1
    - h2o_s2_h2
    - h2o_s2_k1
    - h2o_s2_k2
    - h2o_s2_o1
    - h2o_s2_o2
    - h2o_s3_h1
    - h2o_s3_h2
    - h2o_s3_k1
  window_size: 256
  stride: 128

model:
  num_hands: 2
  img_feat_dim: 512
  d_mem: 128
  d_val: 123
  hidden_dim: 256
  num_blocks: 4
  topk: 8
  exclude_recent: 5
  max_memory_size: 1024
  dropout: 0.1

geometry:
  use_mano: true
  mano_model_path: /data/SuC/Dyn-HaMR/_DATA/data/mano
  flat_hand_mean: false

loss_weights:
  distill: 1.0
  proj: 0.5
  bone: 0.1
  consistency: 0.05
  scale: 0.2
  scale_distill: 0.5
  scale_anchor: 1.0
  prior: 0.08

train:
  epochs: 1200
  max_steps: 10000
  batch_size: 1
  shuffle: true
  num_workers: 0
  lr: 0.0001
  lr_min: 0.000005
  lr_schedule: cosine
  weight_decay: 0.0002
  grad_clip: 1.0
  resume_from: /extra/SuC/experiments/mahmr/h2o_official_train_v1/last.pt
  resume_optimizer: false
  log_every: 10
  plot_every: 100
  output_dir: /extra/SuC/experiments/mahmr/h2o_official_train_v4
